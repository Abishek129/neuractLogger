[pytest]
testpaths = tests
# Tier 1 by default; run tier 2 with: python -m pytest tests/ -q -m e2e
# (a later -m on the CLI overrides this addopts -m)
addopts = -m "not e2e"
markers =
    e2e: tier-2 full-stack tests (Modbus simulator + prebuilt Rust engine + Postgres)
    slow: slower tests (subprocess oracles etc.)
    faults: destructive fault-injection tests (DB-backend kills, SIGTERM, simulator drop) — J3
# pytest-timeout: safety net against hung polls / dead subprocesses
timeout = 180
